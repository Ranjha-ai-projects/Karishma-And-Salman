<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pocketBg" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4e0a1c" />
      <stop offset="60%" stop-color="#5a0e22" />
      <stop offset="100%" stop-color="#641127" />
    </linearGradient>
  </defs>

  <!-- Pocket Base Shape: Bottom rectangle with upper cut-out for flap overlap -->
  <path d="M 10 230 
           L 390 230 
           L 390 40 
           L 240 135
           C 215 150, 185 150, 160 135
           L 10 40 
           Z" 
        fill="url(#pocketBg)" />
        
  <!-- Subtle gold line -->
  <path d="M 10 40 L 160 135 C 185 150, 215 150, 240 135 L 390 40" 
        fill="none" 
        stroke="#deb87b" 
        stroke-width="0.5" 
        stroke-opacity="0.3" />
</svg>
