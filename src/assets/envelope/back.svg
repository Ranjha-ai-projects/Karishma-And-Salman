<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="envelopeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#641127" />
      <stop offset="50%" stop-color="#550c20" />
      <stop offset="100%" stop-color="#420616" />
    </linearGradient>
    <linearGradient id="innerShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <filter id="envShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2c050d" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Base Burgundy Envelope Rectangle -->
  <rect x="10" y="10" width="380" height="380" rx="16" fill="url(#envelopeBg)" filter="url(#envShadow)" />
  <rect x="10" y="10" width="380" height="380" rx="16" fill="url(#innerShine)" />
  
  <!-- Subtle Inset Gold Foil Border -->
  <rect x="14" y="14" width="372" height="372" rx="13" fill="none" stroke="#e0c285" stroke-width="0.75" stroke-opacity="0.35" />
</svg>
