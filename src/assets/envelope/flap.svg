<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="100%" height="100%">
  <defs>
    <linearGradient id="flapBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69122a" />
      <stop offset="85%" stop-color="#550c20" />
      <stop offset="100%" stop-color="#470719" />
    </linearGradient>
    <filter id="flapShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#180207" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Flap Shape: Top Flat edge with rounded corners, sloped sides coming to a smooth rounded bottom V-tab -->
  <path d="M 10 10 
           L 390 10 
           L 390 40
           C 390 70, 260 215, 218 218
           C 208 220, 192 220, 182 218
           C 140 215, 10 70, 10 40
           Z" 
        fill="url(#flapBg)" 
        filter="url(#flapShadow)" />

  <!-- Gold Accent Edge on Flap Crease / Contour -->
  <path d="M 12 14 
           L 388 14 
           L 388 38
           C 388 68, 258 212, 217 215
           C 207 217, 193 217, 183 215
           C 142 212, 12 68, 12 38
           Z" 
        fill="none" 
        stroke="#f2dfb1" 
        stroke-width="0.75" 
        stroke-opacity="0.35" />
</svg>
